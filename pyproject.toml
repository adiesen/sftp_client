[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sftp-client"
version = "0.1.0"
description = "A simple interactive SFTP client"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["paramiko>=4.0,<5"]

[project.scripts]
sftp-client = "sftp_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
